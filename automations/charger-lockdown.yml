alias: Tesla Charging - Security - Autel lockdown when Myszolot away
description: >
  Security gate for the Autel charger. When the Tesla is away from the garage
  (Frigate spot classifier when available, else device tracker), forces the
  Autel charger off.
  A 5-minute watchdog trigger self-heals any state drift.
triggers:
  - trigger: time_pattern
    minutes: /1
actions:
  - if:
      - condition: template
        value_template: >-
          {{ is_state('switch.autel_charge_control', 'on') and (
               (states('binary_sensor.garage_car_present') not in ['unknown', 'unavailable']
                and not is_state('binary_sensor.garage_car_present', 'on'))
               or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                   and not is_state('device_tracker.myszolot_location', 'home'))
             ) }}
    then:
      - action: switch.turn_off
        target:
          entity_id: switch.autel_charge_control
mode: single

