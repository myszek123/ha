alias: Tesla Charging - Security - Autel lockdown when Myszolot away
description: >
  Security gate for the Autel charger. Locks (turns off) the Autel unless MY car
  is present: garage vision must see a car AND Tesla GPS must not place it
  elsewhere (classifier detects any car). Falls back to GPS=home when vision is
  unavailable. A live home charge (Tesla charging + Autel on + GPS home) is not
  locked on a vision-empty blip (20-08-2026 14:12).
triggers:
  - trigger: time_pattern
    minutes: /1
actions:
  - if:
      - condition: template
        value_template: >-
          {% set live_hold = states('sensor.myszolot_charging') in ['charging', 'starting', 'on']
              and is_state('switch.autel_charge_control', 'on')
              and is_state('device_tracker.myszolot_location', 'home') %}
          {% set present = (is_state('binary_sensor.garage_car_present', 'on')
                 and (states('device_tracker.myszolot_location') in ['home', 'unknown', 'unavailable']
                      or is_state('input_boolean.myszolot_location_override', 'on')))
              or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                  and (is_state('device_tracker.myszolot_location', 'home')
                       or is_state('input_boolean.myszolot_location_override', 'on'))) %}
          {{ is_state('switch.autel_charge_control', 'on') and not present and not live_hold }}
    then:
      - action: switch.turn_off
        target:
          entity_id: switch.autel_charge_control
mode: single
