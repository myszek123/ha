alias: Myszolot - Trip charging
description: >
  Whole trip-charging behaviour in one automation, so it can be disabled with a
  single toggle.

  Every 30 min, scan both family calendars for the next 16 h. An event further
  out is ignored. An event inside the window naming a known destination
  (Łódź / Leżakowa, Brajniki, Szczytno, działka) arms Myszolot override at 96 %
  with the deadline set to the departure time.

  BOTH ends of an event are departure candidates. A stay-shaped entry like
  "Brajniki visit" 03-09 18:00 -> 08-09 20:15 means: drive out at the start,
  drive home at the end. Keying off the start alone missed every return leg.

  Override — not a bare number.set_value — is what actually holds. In smart
  mode the planner's target is 80 %, so the moment SoC reaches 80 the
  coordinator's should_reset_car_limit_after_session() pushes the car limit
  back to default and a manually set 96 is wiped (observed 08-09: set 96 at
  10:09, SoC hit 80 at 10:27:53, limit reset to 80 at 10:28:00). Override locks
  target_soc = 96 so the reset never fires, and set_mode() pushes the limit to
  the car itself with restore_default=False, which works even when away.

  This is why one branch serves both legs. At home the planner buys the
  cheapest Pstryk hours inside the window; away it cannot actuate the charger
  but still pins the car to 96 %, so plugging in at the działka charges enough
  for the drive back.

  Arrival at a destination is a fallback for stays with no calendar entry: it
  arms override for the maximum 48 h window. If the stay is longer the override
  lapses, the limit relaxes to 80 (better for the battery than sitting at 96
  for days), and the calendar branch re-arms 16 h before the return.

  The three destinations are distinct places — Brajniki (działka, gmina
  Jedwabno) and Szczytno town are 13 km apart and need separate zones.

  queued (not single) so a zone arrival is never dropped because a calendar
  scan happened to be mid-flight.
mode: queued
max: 5

triggers:
  - trigger: time_pattern
    minutes: "/30"
    id: calendar_scan
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.brajniki
    event: enter
    id: arrived_away
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.wisniewscy
    event: enter
    id: arrived_away
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.lodz_mama
    event: enter
    id: arrived_away

conditions: []

actions:
  - choose:

      # ── Calendar: a drive starts or ends within 16 h → arm 96% override ───
      - alias: Calendar trip within 16 h
        conditions:
          - condition: trigger
            id: calendar_scan
          # Only arm from a clean smart state; if already in override, leave
          # it alone. Self-limiting: arming flips mode to override so the next
          # scan skips, and once the deadline passes the departure has passed
          # too, so that candidate fails the >=60 min filter.
          - condition: state
            entity_id: select.myszolot_charge_mode
            state: smart
        sequence:
          - action: calendar.get_events
            target:
              entity_id:
                - calendar.jjsateam_gmail_com
                - calendar.jakubmyszka_gmail_com
            data:
              start_date_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              duration:
                hours: 16
            response_variable: agenda

          # Both start and end are candidate departures. All-day entries
          # (bare date) are treated as a 09:00 departure.
          - variables:
              trips: >-
                {%- set ns = namespace(items=[]) -%}
                {%- set pat = 'łód|lod[zź]|leżakow|lezakow|brajnik|szczytn|dzia[lł]k' -%}
                {%- for cal in agenda.keys() -%}
                  {%- for ev in agenda[cal].events -%}
                    {%- set blob = (ev.summary ~ ' ' ~ ev.get('description', '') ~ ' ' ~ ev.get('location', '')) | lower -%}
                    {%- if blob is search(pat) -%}
                      {%- for leg in ['start', 'end'] -%}
                        {%- set raw = ev.get(leg, '') -%}
                        {%- if raw -%}
                          {%- set dep = (raw ~ 'T09:00:00') if raw | length == 10 else raw -%}
                          {%- set mins = ((as_timestamp(dep) - as_timestamp(now())) / 60) | round(0) | int -%}
                          {%- if mins >= 60 and mins <= 960 -%}
                            {%- set ns.items = ns.items + [{'mins': mins, 'dep': dep, 'summary': ev.summary, 'leg': leg}] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {{ ns.items | sort(attribute='mins') }}

          # Nothing matched → stop here silently.
          - condition: template
            value_template: "{{ trips | count > 0 }}"

          - variables:
              trip: "{{ trips[0] }}"
              # Floor, not ceil: the deadline must land *before* departure,
              # else the planner may buy an hour ending after we have left.
              # Clamped to the helper's 1-48 range.
              window_hours: "{{ [[(trip.mins / 60) | round(0, 'floor') | int, 1] | max, 48] | min }}"

          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_custom_target_soc
            data:
              value: 96

          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_deadline_hours
            data:
              value: "{{ window_hours }}"

          # Full replan: locks 96% against the deadline we just wrote, and
          # pushes the limit to the car even when it is away from home.
          - action: select.select_option
            target:
              entity_id: select.myszolot_charge_mode
            data:
              option: override

          - action: notify.mobile_app_j23
            data:
              title: >-
                {{ 'Powrót' if trip.leg == 'end' else 'Wyjazd' }} — ładowanie 96%
              message: >-
                {{ trip.summary }} —
                {{ 'powrót' if trip.leg == 'end' else 'wyjazd' }}
                {{ as_timestamp(trip.dep) | timestamp_custom('%d-%m-%Y %H:%M') }}.
                Override 96% w oknie {{ window_hours }} h (SoC teraz
                {{ states('sensor.myszolot_battery_level') }}%).
                {{ 'Kabel wpięty.' if is_state('binary_sensor.myszolot_charge_cable', 'on')
                   else 'UWAGA: kabel niewpięty!' }}

      # ── Arrived at a destination with no calendar entry → 48 h fallback ───
      - alias: Arrived at trip destination
        conditions:
          - condition: trigger
            id: arrived_away
          - condition: state
            entity_id: select.myszolot_charge_mode
            state: smart
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_custom_target_soc
            data:
              value: 96

          # Maximum window: we do not know the return time on arrival. If the
          # stay outlasts it the limit relaxes to 80 and the calendar branch
          # re-arms 16 h before the return leg.
          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_deadline_hours
            data:
              value: 48

          - action: select.select_option
            target:
              entity_id: select.myszolot_charge_mode
            data:
              option: override

          - action: notify.mobile_app_j23
            data:
              title: "Na miejscu — limit 96%"
              message: >-
                {{ trigger.zone.attributes.friendly_name | default('Cel podróży') }}:
                override 96% na 48 h (SoC teraz
                {{ states('sensor.myszolot_battery_level') }}%). Podepnij kabel.
