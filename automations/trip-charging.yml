alias: Myszolot - Trip charging
description: >
  Whole trip-charging behaviour in one automation, so it can be disabled with a
  single toggle.

  Outbound (calendar): every 30 min, scan both family calendars for the next
  16 h. An event further out than that is ignored — nothing happens. An event
  inside the window that names a known destination (Łódź / Leżakowa, Brajniki,
  Szczytno, działka) arms Myszolot override at 96 %, with the deadline set to
  the actual departure time. The existing planner then picks the cheapest
  Pstryk hours inside that window instead of charging flat out.

  Return (location): on arrival at any of the three destinations — Brajniki
  (zone.brajniki, the działka), Szczytno (zone.wisniewscy, in-laws in town) or
  Łódź (zone.lodz_mama) — push a 96 % limit to the car so plugging in there
  charges enough for the drive home. These are three distinct places: Brajniki
  and Szczytno are 13 km apart, so one zone cannot cover both. No price
  optimisation on this side — none of them is on Pstryk, and the planner only
  actuates the charger at home. Restoring 80 % on return is handled by
  charge-limit-automation.yml.

  No arm/reset helper: the "mode is smart" condition is self-limiting. Arming
  flips mode to override so the next scan skips; once the deadline passes,
  departure has passed too and the event fails the >=60 min filter.

  queued (not single) so a zone arrival is never dropped because a calendar
  scan happened to be mid-flight.
mode: queued
max: 5

triggers:
  - trigger: time_pattern
    minutes: "/30"
    id: calendar_scan
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.brajniki
    event: enter
    id: arrived_away
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.wisniewscy
    event: enter
    id: arrived_away
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.lodz_mama
    event: enter
    id: arrived_away

conditions: []

actions:
  - choose:

      # ── Outbound: calendar says we drive soon → arm 96% override ──────────
      - alias: Calendar trip within 16 h
        conditions:
          - condition: trigger
            id: calendar_scan
          # Only arm from a clean smart state. Replaces the old trip_armed
          # helper: if we are already in override, leave it alone.
          - condition: state
            entity_id: select.myszolot_charge_mode
            state: smart
        sequence:
          - action: calendar.get_events
            target:
              entity_id:
                - calendar.jjsateam_gmail_com
                - calendar.jakubmyszka_gmail_com
            data:
              start_date_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              duration:
                hours: 16
            response_variable: agenda

          # Future-starting events naming a known destination. All-day entries
          # (start is a bare date) are treated as a 09:00 departure.
          - variables:
              trips: >-
                {%- set ns = namespace(items=[]) -%}
                {%- set pat = 'łód|lod[zź]|leżakow|lezakow|brajnik|szczytn|dzia[lł]k' -%}
                {%- for cal in agenda.keys() -%}
                  {%- for ev in agenda[cal].events -%}
                    {%- set blob = (ev.summary ~ ' ' ~ ev.get('description', '') ~ ' ' ~ ev.get('location', '')) | lower -%}
                    {%- if blob is search(pat) -%}
                      {%- set raw = ev.start -%}
                      {%- set dep = (raw ~ 'T09:00:00') if raw | length == 10 else raw -%}
                      {%- set mins = ((as_timestamp(dep) - as_timestamp(now())) / 60) | round(0) | int -%}
                      {%- if mins >= 60 -%}
                        {%- set ns.items = ns.items + [{'mins': mins, 'dep': dep, 'summary': ev.summary}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {{ ns.items | sort(attribute='mins') }}

          # Nothing matched → stop here silently.
          - condition: template
            value_template: "{{ trips | count > 0 }}"

          - variables:
              trip: "{{ trips[0] }}"
              # Floor, not ceil: the deadline must land *before* departure,
              # else the planner may buy an hour ending after we have left.
              # Clamped to the helper's 1-48 range.
              window_hours: "{{ [[(trip.mins / 60) | round(0, 'floor') | int, 1] | max, 48] | min }}"

          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_custom_target_soc
            data:
              value: 96

          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_deadline_hours
            data:
              value: "{{ window_hours }}"

          # Full replan: locks 96% against the deadline we just wrote.
          - action: select.select_option
            target:
              entity_id: select.myszolot_charge_mode
            data:
              option: override

          - action: notify.mobile_app_j23
            data:
              title: "Wyjazd wykryty — ładowanie 96%"
              message: >-
                {{ trip.summary }} — wyjazd
                {{ as_timestamp(trip.dep) | timestamp_custom('%d-%m-%Y %H:%M') }}.
                Override 96% w oknie {{ window_hours }} h.
                {{ 'Kabel wpięty.' if is_state('binary_sensor.myszolot_charge_cable', 'on')
                   else 'UWAGA: kabel niewpięty!' }}

      # ── Return: arrived at działka / Łódź → car limit 96% ─────────────────
      - alias: Arrived at trip destination
        conditions:
          - condition: trigger
            id: arrived_away
        sequence:
          # Wake first — number.set_value is silently dropped on a sleeping car.
          - action: button.press
            target:
              entity_id: button.myszolot_wake
            continue_on_error: true
          - delay: "00:00:10"

          - action: number.set_value
            target:
              entity_id: number.myszolot_charge_limit
            data:
              value: 96

          - action: notify.mobile_app_j23
            data:
              title: "Na miejscu — limit 96%"
              message: >-
                {{ trigger.zone.attributes.friendly_name | default('Cel podróży') }}:
                limit ładowania ustawiony na 96% (SoC teraz
                {{ states('sensor.myszolot_battery_level') }}%). Podepnij kabel.
