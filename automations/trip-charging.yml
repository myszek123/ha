alias: Myszolot - Trip charging
description: >
  Whole trip-charging behaviour in one automation, so it can be disabled with a
  single toggle.

  Every 30 min, scan both family calendars for the next 16 h. An event further
  out is ignored. An event inside the window arms Myszolot override, with the
  deadline set to the departure time, when it either names a key destination
  (Łódź / Leżakowa, Brajniki, Szczytno, działka) or carries a two-digit
  percentage in its title or description ("Ciechanów:95%"). The percentage is
  that trip's target SoC; an untagged key place uses default_trip_target (96).

  BOTH ends of an event are departure candidates. A stay-shaped entry like
  "Brajniki visit" 03-09 18:00 -> 08-09 20:15 means: drive out at the start,
  drive home at the end. Keying off the start alone missed every return leg.

  Override — not a bare number.set_value — is what actually holds. In smart
  mode the planner's target is 80 %, so the moment SoC reaches 80 the
  coordinator's should_reset_car_limit_after_session() pushes the car limit
  back to default and a manually set 96 is wiped (observed 08-09: set 96 at
  10:09, SoC hit 80 at 10:27:53, limit reset to 80 at 10:28:00). Override locks
  target_soc to the trip target so the reset never fires, and set_mode() pushes
  the limit to the car itself with restore_default=False, which works even when
  away.

  One branch serves both legs. At home the planner buys the cheapest Pstryk
  hours inside the window; away it cannot actuate the charger but still pins
  the car to the trip target, so plugging in at the działka charges for the
  drive back.

  Charging is deliberately tied to departure only — never to arrival. Topping
  up on arrival would leave the car near full for the whole stay, which is bad
  for the pack and is not what was asked for.

  Arming requires BOTH that the mode is smart AND that SoC is below that
  event's own target. Mode alone is not an arm-once guard: override also ends
  when the target is reached, which drops straight back to smart and would let
  the same departure re-arm every 30 min for the rest of the day.
mode: single

variables:
  # Target for a key-place trip whose calendar entry carries no NN% tag.
  default_trip_target: 96

triggers:
  - trigger: time_pattern
    minutes: "/30"
    id: calendar_scan

conditions: []

actions:
  - choose:

      # ── Calendar: a drive starts or ends within 16 h → arm trip override ──
      - alias: Calendar trip within 16 h
        conditions:
          - condition: trigger
            id: calendar_scan
          # Only arm from a clean smart state; if already in override, leave
          # it alone.
          - condition: state
            entity_id: select.myszolot_charge_mode
            state: smart
          # "Mode is smart" alone is NOT an arm-once guard. The SoC-below-target
          # check that makes it one lives in the trips template below, because
          # the target is per event.
        sequence:
          - action: calendar.get_events
            target:
              entity_id:
                - calendar.jjsateam_gmail_com
                - calendar.jakubmyszka_gmail_com
            data:
              start_date_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              duration:
                hours: 16
            response_variable: agenda

          # Both start and end are candidate departures. All-day entries
          # (bare date) are treated as a 09:00 departure.
          #
          # The destination pattern must survive Polish declension: a calendar
          # entry is far more often "Wyjazd do Łodzi" than the bare nominative
          # "Łódź". The declined stem keeps ł but drops the ó (Łódź → Łodzi),
          # so the class [łl][oó]d[zźż] is what covers both, plus the
          # diacritic-free "Lodz" people type on a phone keyboard.
          #
          # Any destination is opted in per event with a two-digit "NN%" tag in
          # the title or description ("Ciechanów:95%"), and NN becomes that
          # trip's target SoC, so a new trip needs a calendar edit, not an
          # automation edit. \s? also takes "95 %" and the non-breaking space
          # phone keyboards insert. Values outside the target helper's min-max
          # (currently 50-100) are ignored — below 50 is a discount, not a trip
          # — and when an entry holds several percentages the highest wins. A
          # key place with a tag uses the tag; without one, default_trip_target.
          #
          # The re-arm guard is per event: a candidate is kept only while SoC is
          # below ITS target. Override ends when the target is reached and drops
          # back to smart, so without this the same departure re-arms every
          # 30 min (observed 08-09-2026: 14:00, 14:30, 15:00 after SoC hit 96).
          # Checking per event also means a trip already satisfied does not
          # block a later one in the window that needs more. An unreadable SoC
          # reads as 0 and arms, failing toward charging.
          #
          # Both patterns match only at the start of a word. Without the
          # lookbehind, [łl][oó]d[zźż] fires inside Włodzimierz, Kołodziej and
          # chłodzenie — a birthday or a plumber would arm a 96 % charge — and
          # the tag fires inside "196%" or a rate like "lokata 3,96%". The letter
          # class lists lowercase Polish letters because the blob is lowercased
          # before matching. leżakow(?!ani) keeps the street (Leżakowa,
          # Leżakowej) but not "leżakowanie", kindergarten nap time.
          #
          # All-day end dates are EXCLUSIVE (iCal/Google): a stay whose last
          # day is 08-09 arrives here as end="2026-09-09". Step back one day
          # so the return leg is not armed 24 h late. Date-only arithmetic,
          # so DST transitions cannot shift the 09:00.
          - variables:
              trips: >-
                {%- set ns = namespace(items=[]) -%}
                {%- set places = '(?<![a-ząćęłńóśźż])(?:[łl][oó]d[zźż]|leżakow(?!ani)|lezakow(?!ani)|brajnik|szczytn|dzia[lł]k)' -%}
                {%- set tag = '(?<![0-9.,])([0-9]{2})\s?%' -%}
                {%- set lo = state_attr('input_number.myszolot_custom_target_soc', 'min') | int(50) -%}
                {%- set hi = state_attr('input_number.myszolot_custom_target_soc', 'max') | int(100) -%}
                {%- set soc = states('sensor.myszolot_battery_level') | int(0) -%}
                {%- for cal in agenda.keys() -%}
                  {%- for ev in agenda[cal].events -%}
                    {%- set blob = (ev.summary ~ ' ' ~ ev.get('description', '') ~ ' ' ~ ev.get('location', '')) | lower -%}
                    {%- set tagged = blob | regex_findall(tag) | map('int') | select('ge', lo) | select('le', hi) | list -%}
                    {%- if tagged or blob is search(places) -%}
                      {%- set target = (tagged | max) if tagged else default_trip_target -%}
                      {%- if soc < target -%}
                        {%- for leg in ['start', 'end'] -%}
                          {%- set raw = ev.get(leg, '') -%}
                          {%- if raw -%}
                            {%- if raw | length == 10 -%}
                              {%- set day = (as_datetime(raw) - timedelta(days=1)).strftime('%Y-%m-%d') if leg == 'end' else raw -%}
                              {%- set dep = day ~ 'T09:00:00' -%}
                            {%- else -%}
                              {%- set dep = raw -%}
                            {%- endif -%}
                            {%- set mins = ((as_timestamp(dep) - as_timestamp(now())) / 60) | round(0) | int -%}
                            {%- if mins >= 60 and mins <= 960 -%}
                              {%- set ns.items = ns.items + [{'mins': mins, 'dep': dep, 'summary': ev.summary, 'leg': leg, 'target': target}] -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {{ ns.items | sort(attribute='mins') }}

          # Nothing matched → stop here silently.
          - condition: template
            value_template: "{{ trips | count > 0 }}"

          - variables:
              trip: "{{ trips[0] }}"
              # Floor, not ceil: the deadline must land *before* departure,
              # else the planner may buy an hour ending after we have left.
              # The >=60 min / <=960 min filter above already bounds this to
              # 1-16, inside the helper's 1-48 range, so only the floor of 1
              # needs enforcing.
              window_hours: "{{ [(trip.mins / 60) | round(0, 'floor') | int, 1] | max }}"

          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_custom_target_soc
            data:
              value: "{{ trip.target }}"

          - action: input_number.set_value
            target:
              entity_id: input_number.myszolot_deadline_hours
            data:
              value: "{{ window_hours }}"

          # Full replan: locks the trip target against the deadline we just
          # wrote, and pushes the limit to the car even when it is away from home.
          - action: select.select_option
            target:
              entity_id: select.myszolot_charge_mode
            data:
              option: override

          - action: notify.mobile_app_j23
            data:
              title: >-
                {{ 'Powrót' if trip.leg == 'end' else 'Wyjazd' }} — ładowanie {{ trip.target }}%
              message: >-
                {{ trip.summary }} —
                {{ 'powrót' if trip.leg == 'end' else 'wyjazd' }}
                {{ as_timestamp(trip.dep) | timestamp_custom('%d-%m-%Y %H:%M') }}.
                Override {{ trip.target }}% w oknie {{ window_hours }} h (SoC teraz
                {{ states('sensor.myszolot_battery_level') }}%).
                {{ 'Kabel wpięty.' if is_state('binary_sensor.myszolot_charge_cable', 'on')
                   else 'UWAGA: kabel niewpięty!' }}
