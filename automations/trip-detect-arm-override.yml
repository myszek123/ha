alias: Myszolot - Arm override for calendar trip
description: >
  Scans both family calendars every 30 min for an upcoming long drive
  (Łódź / Leżakowa, Brajniki, Szczytno, działka). When one starts within the
  next 12 h, arms Myszolot override: target 96% with the deadline set to the
  actual departure time — so the scheduler still buys the cheapest Pstryk hours
  inside that window instead of charging flat out.

  Arming also flips binary_sensor.myszolot_cable_needed, so the existing
  cable-reminder automation nags you to plug in.

  Guarded by input_boolean.myszolot_trip_armed so it fires once per trip.
triggers:
  - trigger: time_pattern
    minutes: "/30"
conditions:
  - condition: state
    entity_id: input_boolean.myszolot_trip_armed
    state: "off"
actions:
  - action: calendar.get_events
    target:
      entity_id:
        - calendar.jjsateam_gmail_com
        - calendar.jakubmyszka_gmail_com
    data:
      start_date_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      duration:
        hours: 12
    response_variable: agenda

  # Collect future-starting events whose text names a known destination.
  # All-day entries (start is a bare date) are treated as a 09:00 departure.
  - variables:
      trips: >-
        {%- set ns = namespace(items=[]) -%}
        {%- set pat = 'łód|lod[zź]|leżakow|lezakow|brajnik|szczytn|dzia[lł]k' -%}
        {%- for cal in agenda.keys() -%}
          {%- for ev in agenda[cal].events -%}
            {%- set blob = (ev.summary ~ ' ' ~ ev.get('description', '') ~ ' ' ~ ev.get('location', '')) | lower -%}
            {%- if blob is search(pat) -%}
              {%- set raw = ev.start -%}
              {%- set dep = (raw ~ 'T09:00:00') if raw | length == 10 else raw -%}
              {%- set mins = ((as_timestamp(dep) - as_timestamp(now())) / 60) | round(0) | int -%}
              {%- if mins >= 60 -%}
                {%- set ns.items = ns.items + [{'mins': mins, 'dep': dep, 'summary': ev.summary}] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {{ ns.items | sort(attribute='mins') }}

  - condition: template
    value_template: "{{ trips | count > 0 }}"

  - variables:
      trip: "{{ trips[0] }}"
      # Override window in whole hours, clamped to the helper's 1–48 range.
      # Floor, not ceil: the deadline must land *before* departure, otherwise the
      # scheduler may plan a cheap hour that ends after you have already left.
      window_hours: "{{ [[(trip.mins / 60) | round(0, 'floor') | int, 1] | max, 48] | min }}"

  - action: input_number.set_value
    target:
      entity_id: input_number.myszolot_custom_target_soc
    data:
      value: 96

  - action: input_number.set_value
    target:
      entity_id: input_number.myszolot_deadline_hours
    data:
      value: "{{ window_hours }}"

  # Selecting override does a full replan: locks 96% and sets the absolute
  # deadline from the helper we just wrote.
  - action: select.select_option
    target:
      entity_id: select.myszolot_charge_mode
    data:
      option: override

  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.myszolot_trip_armed

  - action: notify.mobile_app_j23
    data:
      title: "Wyjazd wykryty — ładowanie 96%"
      message: >-
        {{ trip.summary }} — wyjazd {{ as_timestamp(trip.dep) | timestamp_custom('%d-%m-%Y %H:%M') }}.
        Override 96% w oknie {{ window_hours }} h.
        {{ 'Kabel wpięty.' if is_state('binary_sensor.myszolot_charge_cable', 'on') else 'UWAGA: kabel niewpięty!' }}
mode: single
