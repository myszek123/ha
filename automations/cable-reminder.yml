alias: Tesla Charging - Cable reminder
description: >
  Notifies when charging is needed, the cable is unplugged, and the device
  tracker reports the car at home. Uses binary_sensor.myszolot_cable_needed
  (override is ignored for reminders). Quiet between 23:30 and 06:00.
triggers:
  - trigger: time_pattern
    minutes: "/2"
  - trigger: state
    entity_id: binary_sensor.myszolot_cable_needed
    to: "on"
conditions:
  - condition: state
    entity_id: binary_sensor.myszolot_cable_needed
    state: "on"
  - condition: state
    entity_id: device_tracker.myszolot_location
    state: home
  - condition: template
    value_template: "{{ not is_state('binary_sensor.myszolot_charge_cable', 'on') }}"
  - condition: time
    after: "06:00:00"
    before: "23:30:00"
actions:
  - action: notify.mobile_app_j23
    data:
      title: "Myszolot: EV charging reminder"
      message: >-
        Plug in the cable to charge.
        {% set next = states('sensor.myszolot_next_session_start') %}
        {% if next not in ['unknown', 'unavailable', 'none', ''] %}
        Next session starts at {{ (next | as_timestamp) | timestamp_custom('%H:%M', local=True) }}.
        {% else %}
        Charging session is starting now.
        {% endif %}
mode: single
max_exceeded: silent