alias: Tesla Charging - Main Automation
description: >
  Reads should_charge / target_amps from sensor.myszolot_charge_reason and drives
  home charging. Home power is gated only on the Autel (charge_control + max current,
  hard cap 11 A — house shared load). Always set Autel to target (no amp slew).
  The Tesla charge switch is never turned off — only turned on when a session should
  start (car must request charge). Stop/away only disable Autel so public/supercharger
  sessions are never interrupted. Presence = garage vision + GPS not contradicting.
  Live hold: Tesla charging + Autel on + GPS home must not Remote-off on a
  vision-empty blip (20-08-2026 14:12). State-guarded. Scheduling lives in the
  myszolot coordinator. The Autel is started only when its switch is really off
  and the car is not already charging — "unavailable" means do nothing, since a
  start on an unreachable charger only earns a Rejected (10-09-2026). The car's
  charge switch is likewise turned on only while the Autel is controllable and
  the car switch is really off (12-09-2026).
triggers:
  # State changes only (to: null). The sensor's attributes churn on every
  # coordinator refresh, and an attribute-only trigger re-ran this actuator
  # dozens of extra times an hour. should_charge is the one attribute worth
  # reacting to at once; anything else waits for the 1-minute tick.
  - entity_id: sensor.myszolot_charge_reason
    trigger: state
    to: null
  - entity_id: sensor.myszolot_charge_reason
    attribute: should_charge
    trigger: state
  - minutes: /1
    trigger: time_pattern
actions:
  - choose:
      # Stop: Autel off only — never touch car charge switch
      - conditions:
          - condition: template
            value_template: >-
              {{ state_attr('sensor.myszolot_charge_reason', 'should_charge') in [false, 0, 'false', 'False', 'off', 'no', none]
                 or (state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0)) <= 0 }}
        sequence:
          - if:
              - condition: state
                entity_id: switch.autel_charge_control
                state: "on"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.autel_charge_control
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.garage240socket', 'on') }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.garage240socket
      # Start: Autel on + amps + car charge on (home only for car writes)
      - conditions:
          - condition: template
            value_template: >-
              {{ state_attr('sensor.myszolot_charge_reason', 'should_charge') in [true, 1, 'true', 'True', 'on', 'yes']
                 and (state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0)) > 0
                 and ((is_state('binary_sensor.garage_car_present', 'on')
                       and (states('device_tracker.myszolot_location') in ['home', 'unknown', 'unavailable']
                            or is_state('input_boolean.myszolot_location_override', 'on')))
                      or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                          and (is_state('device_tracker.myszolot_location', 'home')
                               or is_state('input_boolean.myszolot_location_override', 'on')))) }}
        sequence:
          # Shed shared-circuit socket first; brief settle so both aren't loaded together
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.garage240socket', 'off') }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.garage240socket
              - delay:
                  seconds: 5
          # Start the Autel only when it is really off and the car is not
          # already charging. "not on" also matched unavailable: after the
          # 10-09-2026 WiFi drop the charger came back mid-charge with this
          # switch stuck unavailable, every run sent RemoteStartTransaction, the
          # charger answered Rejected, and OCPP re-raised a "Start transaction
          # failed" notification ~700 times. Unavailable means we cannot control
          # it anyway, so do nothing.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('switch.autel_charge_control', 'off')
                     and states('sensor.myszolot_charging') not in ['charging', 'starting'] }}
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.autel_charge_control
          # Skip while the number is unavailable: set_value on it only logs
          # "entity not available" (348 times during the 10-09 outage).
          - if:
              - condition: template
                value_template: >-
                  {{ states('number.autel_maximum_current') not in ['unavailable', 'unknown']
                     and (states('number.autel_maximum_current') | int(-1))
                     != ([state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0), 11] | min) }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.autel_maximum_current
                data:
                  value: "{{ [state_attr('sensor.myszolot_charge_reason', 'target_amps') | int, 11] | min }}"
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('device_tracker.myszolot_location', 'home')
                     and (states('number.myszolot_charge_current') | int(0))
                     < ([state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0), 11] | min) }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.myszolot_charge_current
                data:
                  value: "{{ [state_attr('sensor.myszolot_charge_reason', 'target_amps') | int, 11] | min }}"
          # Ask the car to charge only while HA controls the Autel, and only
          # when the car switch is really off. With the Autel unavailable the
          # car has no power, rejects the command and flips straight back to
          # off, so "not on" re-sent turn_on every minute: 420 on/off toggles
          # overnight 11/12-09-2026, each one a command to the car. An
          # unavailable car switch is skipped for the same reason.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('device_tracker.myszolot_location', 'home')
                     and states('switch.autel_charge_control') not in ['unavailable', 'unknown']
                     and is_state('switch.myszolot_charge', 'off') }}
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.myszolot_charge
      # Car away: lock Autel only — never on a live home charge (Tesla + Autel + GPS)
      - conditions:
          - condition: template
            value_template: >-
              {% set live_hold = states('sensor.myszolot_charging') in ['charging', 'starting', 'on']
                  and is_state('switch.autel_charge_control', 'on')
                  and is_state('device_tracker.myszolot_location', 'home') %}
              {{ not live_hold and not ((is_state('binary_sensor.garage_car_present', 'on')
                       and (states('device_tracker.myszolot_location') in ['home', 'unknown', 'unavailable']
                            or is_state('input_boolean.myszolot_location_override', 'on')))
                      or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                          and (is_state('device_tracker.myszolot_location', 'home')
                               or is_state('input_boolean.myszolot_location_override', 'on')))) }}
        sequence:
          - if:
              - condition: state
                entity_id: switch.autel_charge_control
                state: "on"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.autel_charge_control
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.garage240socket', 'on') }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.garage240socket
mode: single
