alias: Tesla Charging - Main Automation
description: >
  Reads should_charge / target_amps from sensor.myszolot_charge_reason (produced
  by the myszolot custom integration) and drives the physical charger entities.
  Also manages shared-circuit sockets to prevent overload during charging.
  Stopping is never gated by garage vision — only starting requires car present.
  To protect additional sockets/devices, add their entity_ids to both socket lists below.
  Replaces the old G12/price-threshold/override logic — all scheduling decisions
  now live in the integration coordinator.
triggers:
  - entity_id: sensor.myszolot_charge_reason
    trigger: state
  - minutes: /1
    trigger: time_pattern
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ state_attr('sensor.myszolot_charge_reason', 'should_charge') in [false, 0, 'false', 'False', 'off', 'no', none]
                 or (state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0)) <= 0 }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.myszolot_charge
          - action: switch.turn_on
            target:
              entity_id:
                - switch.garage240socket
      - conditions:
          - condition: template
            value_template: >-
              {{ state_attr('sensor.myszolot_charge_reason', 'should_charge') in [true, 1, 'true', 'True', 'on', 'yes']
                 and (state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0)) > 0
                 and (is_state('binary_sensor.garage_car_present', 'on')
                      or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                          and is_state('device_tracker.myszolot_location', 'home'))) }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.garage240socket
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.autel_charge_control', 'on') }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.autel_charge_control
          - action: number.set_value
            target:
              entity_id: number.myszolot_charge_current
            data:
              value: "{{ state_attr('sensor.myszolot_charge_reason', 'target_amps') | int }}"
          - action: switch.turn_on
            target:
              entity_id: switch.myszolot_charge
      - conditions:
          - condition: template
            value_template: >-
              {{ not (is_state('binary_sensor.garage_car_present', 'on')
                      or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                          and is_state('device_tracker.myszolot_location', 'home'))) }}
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.myszolot_charge
          - action: switch.turn_on
            target:
              entity_id:
                - switch.garage240socket
mode: single
