alias: Tesla Charging - Main Automation
description: >
  Reads should_charge / target_amps from sensor.myszolot_charge_reason and drives
  home charging. Home power is gated only on the Autel (charge_control + max current,
  hard cap 12 A). Amp down-ramp is 1 A per minute (time_pattern); ramp-up jumps to
  target so sessions start promptly. The Tesla charge switch is never turned off —
  only turned on when a session should start (car must request charge). Stop/away
  only disable Autel so public/supercharger sessions are never interrupted. Presence
  = garage vision + GPS not contradicting. State-guarded. Scheduling in myszolot.
triggers:
  - entity_id: sensor.myszolot_charge_reason
    trigger: state
  - minutes: /1
    trigger: time_pattern
actions:
  - choose:
      # Stop: Autel off only — never touch car charge switch
      - conditions:
          - condition: template
            value_template: >-
              {{ state_attr('sensor.myszolot_charge_reason', 'should_charge') in [false, 0, 'false', 'False', 'off', 'no', none]
                 or (state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0)) <= 0 }}
        sequence:
          - if:
              - condition: state
                entity_id: switch.autel_charge_control
                state: "on"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.autel_charge_control
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.garage240socket', 'on') }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.garage240socket
      # Start: Autel on + amps + car charge on (home only for car writes)
      - conditions:
          - condition: template
            value_template: >-
              {{ state_attr('sensor.myszolot_charge_reason', 'should_charge') in [true, 1, 'true', 'True', 'on', 'yes']
                 and (state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0)) > 0
                 and ((is_state('binary_sensor.garage_car_present', 'on')
                       and (states('device_tracker.myszolot_location') in ['home', 'unknown', 'unavailable']
                            or is_state('input_boolean.myszolot_location_override', 'on')))
                      or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                          and (is_state('device_tracker.myszolot_location', 'home')
                               or is_state('input_boolean.myszolot_location_override', 'on')))) }}
        sequence:
          # Shed shared-circuit socket first; brief settle so both aren't loaded together
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.garage240socket', 'off') }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.garage240socket
              - delay:
                  seconds: 5
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.autel_charge_control', 'on') }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.autel_charge_control
          # Autel max: raise instantly to desired; lower by 1 A per trigger (~1/min).
          # Avoids mid-session jumps 12→5 that correlated with SuspendedEVSE thrash.
          - variables:
              desired_amps: >-
                {{ [state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0), 12] | min }}
              current_amps: "{{ states('number.autel_maximum_current') | int(-1) }}"
              next_amps: >-
                {% set d = desired_amps | int %}
                {% set c = current_amps | int %}
                {% if c < 0 %}{{ d }}
                {% elif c < d %}{{ d }}
                {% elif c > d %}{{ c - 1 }}
                {% else %}{{ c }}
                {% endif %}
          - if:
              - condition: template
                value_template: >-
                  {{ (current_amps | int(-1)) != (next_amps | int(-1))
                     and (next_amps | int(-1)) >= 0 }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.autel_maximum_current
                data:
                  value: "{{ next_amps | int }}"
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('device_tracker.myszolot_location', 'home')
                     and (states('number.myszolot_charge_current') | int(0))
                     < ([state_attr('sensor.myszolot_charge_reason', 'target_amps') | int(0), 12] | min) }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.myszolot_charge_current
                data:
                  value: "{{ [state_attr('sensor.myszolot_charge_reason', 'target_amps') | int, 12] | min }}"
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('device_tracker.myszolot_location', 'home')
                     and not is_state('switch.myszolot_charge', 'on') }}
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.myszolot_charge
      # Car away: lock Autel only
      - conditions:
          - condition: template
            value_template: >-
              {{ not ((is_state('binary_sensor.garage_car_present', 'on')
                       and (states('device_tracker.myszolot_location') in ['home', 'unknown', 'unavailable']
                            or is_state('input_boolean.myszolot_location_override', 'on')))
                      or (states('binary_sensor.garage_car_present') in ['unknown', 'unavailable']
                          and (is_state('device_tracker.myszolot_location', 'home')
                               or is_state('input_boolean.myszolot_location_override', 'on')))) }}
        sequence:
          - if:
              - condition: state
                entity_id: switch.autel_charge_control
                state: "on"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.autel_charge_control
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.garage240socket', 'on') }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.garage240socket
mode: single
