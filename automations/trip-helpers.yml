# Zones required by automations/trip-charging.yml.
#
# All three destinations are DISTINCT PLACES. An earlier draft treated Brajniki
# and Szczytno as one location because notes/lists/home.md heads a section
# "Działka (Brajniki / Szczytno)" — that was wrong. Reverse geocode of the car
# parked at the działka on 08-09-2026 returned
#   53.554338, 20.809263 -> Rybaczówka, Brajniki, gmina Jedwabno, 12-122
# while zone.wisniewscy resolves to
#   53.561461, 21.008638 -> Szczytno town, 12-100
# They are 13.2 km apart, so one zone cannot cover both, and the arrival
# trigger never fired at the działka while it pointed at Szczytno.
#
# Created on the live instance via the WebSocket config API (zone/create) and
# UI-editable under Settings → Areas & Zones. Recorded here so the repo
# documents the full dependency set.

# --- Brajniki: the działka (car's parked position, gmina Jedwabno) -----------
# zone:
#   - name: Brajniki
#     id: brajniki
#     latitude: 53.554338
#     longitude: 20.809263
#     radius: 150
#     icon: mdi:pine-tree

# --- Łódź: mama's house, Leżakowa 1, Ruda Pabianicka, 93-430 ----------------
# Coordinates from OpenStreetMap/Nominatim, exact building match (osm way
# 285885845). 123.8 km straight-line from home, consistent with the Łódź street
# list in tools/charge_log.py (Leżakowa / Plenerowa / Paradna).
# Name deliberately has no diacritics so the slug is zone.lodz_mama.
# zone:
#   - name: Lodz Mama
#     id: lodz_mama
#     latitude: 51.70737
#     longitude: 19.455401
#     radius: 150
#     icon: mdi:home-heart

# --- Szczytno: in-laws in town — ALREADY EXISTED as zone.wisniewscy ---------
# (53.56146141630418, 21.008638136297023, radius 30 m). Consider widening to
# ~100 m: at 30 m a GPS drift can miss the zone-enter trigger entirely. Left
# unchanged because other automations (charger-lockdown, presence) already
# depend on its current geometry.
#
# NOTE: no input_boolean is needed. An earlier draft used
# input_boolean.myszolot_trip_armed as an arm-once guard; the "mode is smart"
# condition in trip-charging.yml does the same job without the extra helper or
# the reset automation it required.
