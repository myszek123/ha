# Zone reference — NOT a dependency of any automation in this repo.
#
# HISTORY / WHY THIS FILE STILL EXISTS
# An earlier draft of trip-charging.yml had a second branch that triggered on
# `zone` enter and pushed a 96 % car limit on ARRIVAL at the destination. That
# branch was dropped (commit "Drop arrival branch: charge only before
# departure") because topping up on arrival leaves the pack near full for the
# whole stay. trip-charging.yml is now calendar-only and references no zone at
# all.
#
# Verified 08-09-2026: `grep -rn 'wisniewscy|brajniki|lodz_mama' automations/`
# returns nothing outside this file. charger-lockdown.yml keys on
# `device_tracker.myszolot_location` being 'home', not on any zone. An earlier
# version of this comment claimed charger-lockdown and presence depended on
# zone.wisniewscy's geometry — that was wrong.
#
# The zones are kept on the live instance anyway: they make
# device_tracker.myszolot_location report a readable place name ("Brajniki")
# instead of "not_home", which is worth having on the map and in history.
# They are defined on the live instance (created via the WebSocket config API,
# UI-editable under Settings → Areas & Zones) and are recorded here only so the
# coordinates survive a rebuild. Nothing in this file is loaded by HA.
#
# The geocoding below is real and worth keeping: Brajniki and Szczytno are
# DISTINCT PLACES 13.2 km apart. An earlier draft treated them as one location
# because notes/lists/home.md heads a section "Działka (Brajniki / Szczytno)".
# Reverse geocode of the car parked at the działka on 08-09-2026 returned
#   53.554338, 20.809263 -> Rybaczówka, Brajniki, gmina Jedwabno, 12-122
# while zone.wisniewscy resolves to
#   53.561461, 21.008638 -> Szczytno town, 12-100

# --- Brajniki: the działka (car's parked position, gmina Jedwabno) -----------
# zone:
#   - name: Brajniki
#     id: brajniki
#     latitude: 53.554338
#     longitude: 20.809263
#     radius: 150
#     icon: mdi:pine-tree

# --- Łódź: mama's house, Leżakowa 1, Ruda Pabianicka, 93-430 ----------------
# Coordinates from OpenStreetMap/Nominatim, exact building match (osm way
# 285885845). 123.8 km straight-line from home, consistent with the Łódź street
# list in tools/charge_log.py (Leżakowa / Plenerowa / Paradna).
# Name deliberately has no diacritics so the slug is zone.lodz_mama.
# zone:
#   - name: Lodz Mama
#     id: lodz_mama
#     latitude: 51.70737
#     longitude: 19.455401
#     radius: 150
#     icon: mdi:home-heart

# --- Szczytno: in-laws in town — pre-existed as zone.wisniewscy -------------
# (53.56146141630418, 21.008638136297023, radius 30 m). 30 m is tight enough
# that GPS drift can miss a zone-enter, but nothing triggers on it today, so it
# is left alone.
