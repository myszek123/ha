alias: Myszolot - Away trip charge limit 96%
description: >
  When the car arrives at a trip destination (Brajniki/Szczytno działka, or
  Łódź), push a 96% charge limit to the car so whatever charging happens there
  tops up enough for the drive home (~180+ km each way).

  No smart scheduling here on purpose: the działka is on Energa and Łódź is on
  mama's meter — there is no Pstryk dynamic price to optimise against, and
  Myszolot only actuates the charger at home anyway (outside_not_charging).

  Restoring 80% on return is already handled by
  automation.tesla_set_charge_limit_by_mode, which triggers on
  device_tracker.myszolot_location → home.
triggers:
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.wisniewscy
    event: enter
  - trigger: zone
    entity_id: device_tracker.myszolot_location
    zone: zone.lodz_mama
    event: enter
conditions: []
actions:
  # Wake first — number.set_value fails silently on a sleeping car.
  - action: button.press
    target:
      entity_id: button.myszolot_wake
    continue_on_error: true
  - delay: "00:00:10"

  - action: number.set_value
    target:
      entity_id: number.myszolot_charge_limit
    data:
      value: 96

  - action: notify.mobile_app_j23
    data:
      title: "Na miejscu — limit 96%"
      message: >-
        {{ trigger.zone.attributes.friendly_name | default('Cel podróży') }}:
        limit ładowania ustawiony na 96% (SoC teraz
        {{ states('sensor.myszolot_battery_level') }}%). Podepnij kabel.
mode: single
