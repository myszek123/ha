alias: Myszolot - Reset trip armed flag
description: >
  Clears input_boolean.myszolot_trip_armed so the next calendar trip can arm
  override again. Cleared when the override ends (mode settles back on smart —
  deadline reached, target reached, or you tapped smart yourself), and as a
  24 h backstop in case the mode transition is missed.

  The 10-minute delay on the smart trigger is deliberate: Myszolot arms a short
  pending-smart window (MODE_PENDING_SMART_SECONDS) that a re-tap of override
  can cancel, so we wait until the transition is definitely settled.
triggers:
  - trigger: state
    entity_id: select.myszolot_charge_mode
    to: smart
    for: "00:10:00"
    id: mode_settled
  - trigger: state
    entity_id: input_boolean.myszolot_trip_armed
    to: "on"
    for: "24:00:00"
    id: backstop
conditions:
  - condition: state
    entity_id: input_boolean.myszolot_trip_armed
    state: "on"
actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.myszolot_trip_armed
mode: single
