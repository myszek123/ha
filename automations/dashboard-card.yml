# Myszolot charging panel for Overview.
# Smart (80%) + temporary override (target % within N hours).
type: vertical-stack
cards:
  # ── Status (Decision / Mode / Battery / Cable) ─────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.myszolot_charge_reason
        name: Decision
        icon: mdi:head-cog-outline
      - type: tile
        entity: select.myszolot_charge_mode
        name: Mode
        icon: mdi:ev-station
      - type: tile
        entity: sensor.myszolot_battery_level
        name: Battery
        icon: mdi:car-electric
      - type: tile
        entity: binary_sensor.myszolot_charge_cable
        name: Cable
        icon: mdi:ev-plug-type2

  # ── Plan summary ──────────────────────────────────────────────────────────
  - type: markdown
    content: >
      {% set mode = states('select.myszolot_charge_mode') %}

      {% set reason = states('sensor.myszolot_charge_reason') %}

      {% set soc = states('sensor.myszolot_battery_level') %}

      {% set end_soc = states('sensor.myszolot_expected_end_soc') %}

      {% set max_soc = states('sensor.myszolot_max_reachable_soc') %}

      {% set cost = states('sensor.myszolot_charge_schedule') | float(0) %}

      {% set mins = states('sensor.myszolot_planned_session_duration') | int(0) %}

      {% set amps = state_attr('sensor.myszolot_charge_reason', 'charge_amps') %}

      {% set kwh = state_attr('sensor.myszolot_charge_schedule', 'planned_kwh') | float(0) %}

      {% set start = state_attr('sensor.myszolot_charge_schedule', 'planned_session_start') %}

      {% set end = state_attr('sensor.myszolot_charge_schedule', 'planned_session_end') %}

      {% set target = state_attr('sensor.myszolot_charge_reason', 'target_soc') %}

      {% set feasible = state_attr('sensor.myszolot_charge_reason', 'feasible') %}

      {% set shortfall = state_attr('sensor.myszolot_charge_reason', 'shortfall_soc') %}

      {% set rem = states('sensor.myszolot_override_remaining') %}

      {% set hours = (mins // 60) %}

      {% set remm = (mins % 60) %}

      ### Plan

      **{{ mode }}** · `{{ reason }}` · target **{{ target }}%**


      {% if mode == 'override' %}

      Override window remaining: **{{ rem }}**

      {% endif %}


      {% if feasible is defined and feasible == false %}

      ⚠️ **Target may be unreachable** at {{ amps }}A — max ~**{{ max_soc }}%** (shortfall ~{{ shortfall }}%)

      {% endif %}


      {% if mins > 0 and start %}

      {% set secs = as_timestamp(start) - as_timestamp(now()) %}

      {% if secs > 0 %}

      {% set rel_h = (secs // 3600) | int %}

      {% set rel_m = ((secs % 3600) // 60) | int %}

      {% if rel_h > 0 %}

      {% set rel = 'in ' ~ rel_h ~ 'h' ~ (rel_m ~ 'm' if rel_m else '') %}

      {% else %}

      {% set rel = 'in ' ~ rel_m ~ ' min' %}

      {% endif %}

      {% elif as_timestamp(now()) < as_timestamp(end) %}

      {% set rel = 'active now' %}

      {% else %}

      {% set rel = 'ended' %}

      {% endif %}

      - **Window:** {{ as_timestamp(start) | timestamp_custom('%H:%M', true) }}–{{ as_timestamp(end) | timestamp_custom('%H:%M', true) }} *({{ rel }})*

      - **Length:** {% if hours %}{{ hours }}h {% endif %}{{ remm }}min · **{{ amps }}A** (~{{ '%.2f'|format(kwh) }} kWh)

      - **SoC:** {{ soc }}% → **~{{ end_soc }}%** (max ~{{ max_soc }}%)

      - **Planned cost:** ~**{{ '%.2f'|format(cost) }} PLN**

      {% else %}

      _No session planned right now._

      {% endif %}

  # ── Override params + compact actions ─────────────────────────────────────
  - type: markdown
    content: >
      **Override** — set target % and window, then activate.
      Cheapest hours (no price hard-stop); auto-returns to smart when done.
  - type: entities
    entities:
      - entity: input_number.myszolot_custom_target_soc
        name: Target SoC %
      - entity: input_number.myszolot_deadline_hours
        name: Within hours
  # Compact action row: Start override | Smart (80%)
  - type: horizontal-stack
    cards:
      - type: button
        name: Start override
        icon: mdi:target
        show_state: false
        icon_height: 28px
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: override
      - type: button
        name: Smart (80%)
        icon: mdi:brain
        show_state: false
        icon_height: 28px
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: smart

  # ── House vacancy / presence simulation (Omada S23 + Z8 Flip) ─────────────
  - type: markdown
    content: >
      {% set v = states('binary_sensor.house_vacant_24h') %}

      {% set status = states('sensor.house_vacancy_status') %}

      {% set s23o = state_attr('binary_sensor.house_vacant_24h', 's23_online') %}

      {% set s23a = state_attr('binary_sensor.house_vacant_24h', 's23_age_h') %}

      {% set z8o = state_attr('binary_sensor.house_vacant_24h', 'z8_online') %}

      {% set z8a = state_attr('binary_sensor.house_vacant_24h', 'z8_age_h') %}

      ### Presence / vacant home


      {% set pause = states('input_boolean.presence_sim_pause') %}

      {% set on_dl = state_attr('binary_sensor.house_vacant_24h', 'on_deadline') %}

      {% if pause == 'on' %}

      **Presence sim PAUSED** — lights will not change (guests / home without phones)

      {% elif v == 'on' %}

      **House vacant ≥ 24h** — evening light simulation armed

      {% elif v == 'off' %}

      **Someone home / recent** — simulation idle

      {% else %}

      **Vacancy unknown** (sensor not updated yet)

      {% endif %}


      - Status: `{{ status }}`

      - **S23** (Jakub): {% if s23o == true %}online{% elif s23o == false %}offline {{ s23a }}h{% else %}?{% endif %}

      - **Z8 Flip** (Sylwia): {% if z8o == true %}online{% elif z8o == false %}offline {{ z8a }}h{% else %}?{% endif %}

      {% if on_dl %}

      - Tonight ON schedule: `{{ on_dl[11:16] }}` (20:00±15)

      {% endif %}


      _Omada only. Vacant → lights ON together at random 20:00±15, OFF 22:30–23:30. One phone notify on ON. Pause toggle below for guests / home with phones off._

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: binary_sensor.house_vacant_24h
        name: Vacant 24h
        icon: mdi:home-off
      - type: tile
        entity: sensor.house_vacancy_status
        name: Vacancy detail
        icon: mdi:shield-home
      - type: tile
        entity: input_boolean.presence_sim_pause
        name: Pause presence sim
        icon: mdi:account-supervisor
        color: amber

  # ── Last complete drive week (Mon–Sun, from charge-log) ───────────────────
  - type: markdown
    content: >
      {% set w = 'sensor.myszolot_weekly_drive' %}

      {% set start = state_attr(w, 'week_start') %}

      {% set end = state_attr(w, 'week_end') %}

      {% set hours = state_attr(w, 'hours') %}

      {% set dist = state_attr(w, 'distance_km') %}

      {% set energy = state_attr(w, 'energy_kwh') %}

      {% set drives = state_attr(w, 'drives') %}

      {% set vmax = state_attr(w, 'max_speed_kmh') %}

      {% set when = state_attr(w, 'max_speed_when') %}

      {% set driver = state_attr(w, 'max_speed_driver') %}

      {% set route = state_attr(w, 'max_speed_route') %}

      {% set at_max = state_attr(w, 'all_time_max_speed_kmh') %}

      ### Last week drives

      {% if start %}

      **{{ start }} → {{ end }}**


      - **{{ dist }} km** · **{{ hours }} h** · **{{ energy }} kWh** · {{ drives }} trips

      - Max **{{ vmax }} km/h** {% if when %}({{ when }}){% endif %}

        {% if driver %}· driver *{{ driver }}*{% endif %}

      {% if route %}

      - Route: {{ route }}

      {% endif %}

      {% if at_max %}

      - All-time max: **{{ at_max }} km/h**

      {% endif %}

      {% else %}

      _No weekly stats yet — charge-log pushes after daily/Monday run._

      {% endif %}

  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.myszolot_weekly_drive_distance
        name: Week km
        icon: mdi:map-marker-distance
      - type: tile
        entity: sensor.myszolot_weekly_drive_hours
        name: Week hours
        icon: mdi:clock-outline
      - type: tile
        entity: sensor.myszolot_weekly_drive_energy
        name: Week energy
        icon: mdi:lightning-bolt
      - type: tile
        entity: sensor.myszolot_weekly_drive_max_speed
        name: Week max speed
        icon: mdi:speedometer

  # ── Overrides / Tesla ─────────────────────────────────────────────────────
  - type: entities
    title: Overrides / Tesla
    entities:
      - entity: input_boolean.myszolot_location_override
        name: Force home (GPS fix)
      - entity: number.myszolot_charge_current
        name: Charge current (A)
      - entity: number.myszolot_charge_limit
        name: Charge limit %
      - entity: switch.myszolot_charge
        name: Charge switch
