# Myszolot charging panel for Overview.
# Status tiles + plan summary (no duplicate session tiles).
type: vertical-stack
cards:
  # ── Status: Battery | Mode / Decision | Cable ─────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.myszolot_battery_level
        name: Battery
        icon: mdi:car-electric
      - type: tile
        entity: select.myszolot_charge_mode
        name: Mode
        icon: mdi:ev-station
      - type: tile
        entity: sensor.myszolot_charge_reason
        name: Decision
        icon: mdi:head-cog-outline
      - type: tile
        entity: binary_sensor.myszolot_charge_cable
        name: Cable
        icon: mdi:ev-plug-type2

  # ── Plan summary (single place for window / length / SoC / cost) ──────────
  - type: markdown
    content: >
      {% set mode = states('select.myszolot_charge_mode') %}

      {% set reason = states('sensor.myszolot_charge_reason') %}

      {% set soc = states('sensor.myszolot_battery_level') %}

      {% set end_soc = states('sensor.myszolot_expected_end_soc') %}

      {% set cost = states('sensor.myszolot_charge_schedule') %}

      {% set mins = states('sensor.myszolot_planned_session_duration') | int(0) %}

      {% set amps = state_attr('sensor.myszolot_charge_reason', 'charge_amps') %}

      {% set kwh = state_attr('sensor.myszolot_charge_schedule', 'planned_kwh') %}

      {% set start = state_attr('sensor.myszolot_charge_schedule', 'planned_session_start') %}

      {% set end = state_attr('sensor.myszolot_charge_schedule', 'planned_session_end') %}

      {% set hours = (mins // 60) %}

      {% set rem = (mins % 60) %}

      ### Plan

      **{{ mode }}** · `{{ reason }}`


      {% if mins > 0 and start %}

      {% set secs = as_timestamp(start) - as_timestamp(now()) %}

      {% if secs > 0 %}

      {% set rel_h = (secs // 3600) | int %}

      {% set rel_m = ((secs % 3600) // 60) | int %}

      {% if rel_h > 0 %}

      {% set rel = 'in ' ~ rel_h ~ 'h' ~ (rel_m ~ 'm' if rel_m else '') %}

      {% else %}

      {% set rel = 'in ' ~ rel_m ~ ' min' %}

      {% endif %}

      {% elif as_timestamp(now()) < as_timestamp(end) %}

      {% set rel = 'active now' %}

      {% else %}

      {% set rel = 'ended' %}

      {% endif %}

      - **Window:** {{ as_timestamp(start) | timestamp_custom('%H:%M', true) }}–{{ as_timestamp(end) | timestamp_custom('%H:%M', true) }} *({{ rel }})*

      - **Length:** {% if hours %}{{ hours }}h {% endif %}{{ rem }}min · **{{ amps }}A** (~{{ kwh }} kWh)

      - **SoC:** {{ soc }}% → **~{{ end_soc }}%**

      - **Planned cost:** ~**{{ cost }} PLN**

      {% else %}

      _No session planned right now._

      {% endif %}

  # ── Daily modes ───────────────────────────────────────────────────────────
  - type: markdown
    content: "**Daily — target 80%**"
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        name: Smart
        icon: mdi:brain
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: smart
      - type: button
        name: Fast now
        icon: mdi:flash
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: now_fast
      - type: button
        name: Slow now
        icon: mdi:leaf
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: now_slow

  # ── Custom target ─────────────────────────────────────────────────────────
  - type: markdown
    content: "**Custom target**"
  - type: entities
    entities:
      - entity: input_number.myszolot_custom_target_soc
        name: Target SoC %
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: Smart custom
        icon: mdi:tune
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: smart_custom
      - type: button
        name: Charge now
        icon: mdi:flash-auto
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: now_custom

  # ── Timed window ──────────────────────────────────────────────────────────
  - type: markdown
    content: "**Timed window** — start hour + duration, then auto back to smart"
  - type: entities
    entities:
      - entity: input_number.myszolot_timed_start_hour
        name: Start hour
      - entity: input_number.myszolot_timed_duration_minutes
        name: Duration (min)
  - type: grid
    columns: 1
    square: false
    cards:
      - type: button
        name: Timed charge
        icon: mdi:clock-start
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: timed

  # ── Trip ──────────────────────────────────────────────────────────────────
  - type: markdown
    content: "**Trip — 95%**"
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: Plan trip
        icon: mdi:map-marker-path
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: plan_trip
      - type: button
        name: Trip now
        icon: mdi:car-sports
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: trip_now

  # ── Overrides ─────────────────────────────────────────────────────────────
  - type: entities
    title: Overrides / Tesla
    entities:
      - entity: input_boolean.myszolot_location_override
        name: Force home (GPS fix)
      - entity: number.myszolot_charge_current
        name: Charge current (A)
      - entity: number.myszolot_charge_limit
        name: Charge limit %
      - entity: switch.myszolot_charge
        name: Charge switch
