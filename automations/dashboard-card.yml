type: vertical-stack
cards:
  - type: entities
    title: Myszolot Charging
    entities:
      - entity: sensor.myszolot_charge_reason
        name: Decision
      - entity: sensor.myszolot_battery_level
        name: Battery SoC
      - entity: select.myszolot_charge_mode
        name: Mode
      - entity: sensor.myszolot_charge_schedule
        name: Est. remaining cost
      - entity: sensor.myszolot_next_session_start
        name: Next session
      - entity: binary_sensor.myszolot_charge_cable
        name: Cable connected
      - entity: input_boolean.myszolot_location_override
        name: Location override
  - type: markdown
    content: "**Daily — 80%**"
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        name: Smart
        icon: mdi:brain
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: smart
      - type: button
        name: Fast now
        icon: mdi:flash
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: now_fast
      - type: button
        name: Slow now
        icon: mdi:leaf
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: now_slow
  - type: markdown
    content: "**Custom target**"
  - type: entities
    entities:
      - entity: input_number.myszolot_custom_target_soc
        name: Target SoC %
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: Smart custom
        icon: mdi:tune
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: smart_custom
      - type: button
        name: Charge now custom
        icon: mdi:flash-auto
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: now_custom
  - type: markdown
    content: "**Timed window — fixed hours (e.g. cheap 2–5)**"
  - type: entities
    entities:
      - entity: input_number.myszolot_timed_start_hour
        name: Start hour
      - entity: input_number.myszolot_timed_duration_minutes
        name: Duration (min)
  - type: grid
    columns: 1
    square: false
    cards:
      - type: button
        name: Timed charge
        icon: mdi:clock-start
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: timed
  - type: markdown
    content: "**Trip — 95%**"
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: Plan trip
        icon: mdi:map-marker-path
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: plan_trip
      - type: button
        name: Trip now
        icon: mdi:car-sports
        tap_action:
          action: call-service
          service: select.select_option
          service_data:
            entity_id: select.myszolot_charge_mode
            option: trip_now
