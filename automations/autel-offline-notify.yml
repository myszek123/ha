# Warn when the Autel charger is unreachable from HA.
#
# 10-09-2026: after a WiFi drop the charger came back online (OCPP ping/pong
# alive) but switch.autel_charge_control stayed unavailable for days. HA could
# neither start nor stop charging, and overnight 11/12-09 a planned charge to
# 90 % silently never happened (car at no_power from 20:19). An OCPP reload and
# TriggerMessage did not help; power-cycling the charger is the fix.
#
# Check often, notify rarely: the watchdog looks every minute, alerts only
# after 10 min offline, at most every 2 h, and never 22:00–07:00 (an overnight
# outage is reported at 07:00). Both automations share one notification tag,
# so alerts replace each other on the phone instead of stacking.

- id: myszolot_autel_offline
  alias: Myszolot - Autel offline watchdog
  description: >
    Every minute: if switch.autel_charge_control has been unavailable or
    unknown for at least 10 minutes, HA cannot start or stop the Autel. Notify
    outside 22:00–07:00, at most every 2 h, saying whether a planned charge is
    being blocked and for how long. Also catches an outage that began at night
    or before this automation existed.
  triggers:
    - trigger: time_pattern
      minutes: "/1"
  conditions:
    - condition: state
      entity_id: switch.autel_charge_control
      state:
        - unavailable
        - unknown
      for: "00:10:00"
    - condition: time
      after: "07:00:00"
      before: "22:00:00"
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none
           or (now() - this.attributes.last_triggered).total_seconds() >= 7200 }}
  actions:
    - variables:
        planned: >-
          {{ state_attr('sensor.myszolot_charge_reason', 'should_charge')
             in [true, 1, 'true', 'True', 'on', 'yes'] }}
        offline_for: >-
          {%- set m = ((now() - states.switch.autel_charge_control.last_changed).total_seconds() / 60) | int -%}
          {%- if m >= 2880 -%}{{ m // 1440 }} days{%- elif m >= 120 -%}{{ m // 60 }} h{%- else -%}{{ m }} min{%- endif -%}
    - action: notify.mobile_app_j23
      data:
        title: >-
          {{ 'Myszolot: planned charge blocked' if planned else 'Myszolot: Autel charger offline' }}
        message: >-
          {% if planned %}Planner wants to charge ({{ states('sensor.myszolot_charge_reason') }},
          target {{ state_attr('sensor.myszolot_charge_reason', 'target_soc') }} %) but the Autel
          has been offline for {{ offline_for }}, so the car gets no power
          (now {{ states('sensor.myszolot_battery_level') }} %,
          {{ states('sensor.myszolot_charging') }}).{% else %}HA has had no control of the
          Autel for {{ offline_for }}, so it cannot start or stop charging
          (car {{ states('sensor.myszolot_battery_level') }} %,
          {{ states('sensor.myszolot_charging') }}).{% endif %} Power-cycle the charger.
        data:
          tag: myszolot-autel-offline
          alert_once: true
  mode: single

- id: myszolot_autel_back_online
  alias: Myszolot - Autel back online
  description: >
    Autel control recovered after at least 10 minutes offline. By day it
    replaces the offline alert with a short note; at night (22:00–07:00) it
    silently clears that alert instead of pinging.
  triggers:
    - trigger: state
      entity_id: switch.autel_charge_control
      from:
        - unavailable
        - unknown
      to:
        - "on"
        - "off"
  conditions:
    - condition: template
      value_template: >-
        {{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 600 }}
  actions:
    - if:
        - condition: time
          after: "07:00:00"
          before: "22:00:00"
      then:
        - action: notify.mobile_app_j23
          data:
            title: "Myszolot: Autel back online"
            message: >-
              HA controls the Autel again (charge control {{ trigger.to_state.state }}).
              Charging follows the plan: {{ states('sensor.myszolot_charge_reason') }}.
            data:
              tag: myszolot-autel-offline
      else:
        - action: notify.mobile_app_j23
          data:
            message: clear_notification
            data:
              tag: myszolot-autel-offline
  mode: single
