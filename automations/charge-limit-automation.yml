alias: Tesla Charging - Set Charge Limit by Mode
description: >
  Smart mode sets the Tesla charge limit to the daily target (80%).
  Override mode sets it to input_number.myszolot_custom_target_soc.
  Only applies when the car is at home.
triggers:
  - entity_id: select.myszolot_charge_mode
    trigger: state
  - entity_id: input_number.myszolot_custom_target_soc
    trigger: state
conditions:
  - condition: state
    entity_id: device_tracker.myszolot_location
    state: home
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: select.myszolot_charge_mode
            state: override
        sequence:
          - action: number.set_value
            target:
              entity_id: number.myszolot_charge_limit
            data:
              value: "{{ states('input_number.myszolot_custom_target_soc') | int }}"
    default:
      - action: number.set_value
        target:
          entity_id: number.myszolot_charge_limit
        data:
          value: 80
mode: single
